---
layout: default
---

<div class="archive">
  {% for post in site.posts %}
    <div class="archive-item">
      <span class="post-date archive-date fs-4">{{ post.date | date_to_string  }}</span>
      <a href="{{ post.url | relative_url }}" class="archive-title fs-4">{{ post.title }}</a>
    </div>
  {% endfor %}
</div>
