---
layout: default
---

<div class="post">

  {% if page.header %}
    <img src="{{ page.header }}" id="header-image">
  {% endif %}
  
  <h1 class="page-title">{{ page.title }}</h1>
  <span class="fs-4 text-muted">{{ page.date | date: "%B %d, %Y" }}</span>
  <div class="mt-4">{{ content }}</div>
</div>
